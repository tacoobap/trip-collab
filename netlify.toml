[build]
  command = "npm run build"
  publish = "dist"

# Allow auth popup to close (Google sign-in); COOP block would otherwise prevent window.close()
[[headers]]
  for = "/*"
  [headers.values]
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# satori shapes text with harfbuzz, whose emscripten glue loads `hb.wasm` from
# its own directory at import time. Bundled, that directory becomes the
# function's, where the file isn't — and because harfbuzzjs exports a bare
# promise, the miss surfaces as an unhandled rejection during module load, so
# every `og-image` request 502s before the handler runs at all. Left external,
# the package ships whole and finds its wasm beside itself.
[functions."og-image"]
  external_node_modules = ["harfbuzzjs"]

# `og-image` resizes a trip's cover photo through Netlify's image CDN before
# drawing the card. Remote hosts have to be listed here or it refuses them —
# these are the two places `image_url` can point at.
[images]
  remote_images = [
    "https://raw\\.githubusercontent\\.com/.*",
    "https://images\\.unsplash\\.com/.*",
  ]

# The two links people paste into a chat are served with meta tags describing
# that trip. Both must stay above the catch-all, which would otherwise hand them
# the same generic shell every other route gets.
[[redirects]]
  from = "/trip/:slug"
  to = "/.netlify/functions/link-preview?kind=trip&id=:slug"
  status = 200

[[redirects]]
  from = "/i/:token"
  to = "/.netlify/functions/link-preview?kind=share&id=:token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
